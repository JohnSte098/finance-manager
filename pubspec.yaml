name: money_manager
description: Pro Money Manager - Premium Finance Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^0.69.0

  # Export
  excel: ^4.0.6
  path_provider: ^2.1.3
  share_plus: ^10.0.0

  # UI Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Biometric Auth
  local_auth: ^2.3.0

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_native_splash:
  color: "#111116"
  image: "assets/logo.png"
  android_12:
    color: "#111116"
    image: "assets/logo.png"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#111116"
  adaptive_icon_foreground: "assets/logo.png"
